# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # These compiled-lock entries cannot move independently of their parents.
    # Revisit the docutils cap when myst-parser supports 0.23+, and update
    # pydantic-core only alongside the Pydantic version that pins it exactly.
    ignore:
      - dependency-name: "docutils"
        versions:
          - ">=0.23"
      - dependency-name: "pydantic-core"
    groups:
      app:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
