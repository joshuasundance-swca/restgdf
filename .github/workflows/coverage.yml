name: coverage

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "restgdf/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  coverage:
    if: "!contains(github.event.head_commit.message, 'Bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Python libraries
      run: |
        pip install --user -r requirements.txt "setuptools>=61" ".[dev,geo,resilience,telemetry]"
    - name: "Run coverage"
      run: |
        coverage run
        # Print the report to the workflow log so threshold failures are
        # visible; the same invocation also writes the markdown copy.
        coverage report -m --precision=2
        coverage report -m --format=markdown > COVERAGE.md
        coverage html
        coverage json -o coverage.json
        python .github/scripts/generate_coverage_badge.py coverage.json coverage.svg
        rm -f coverage.json
    - name: Commit changes
      with:
        COMMIT_MESSAGE: "Update coverage"
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
