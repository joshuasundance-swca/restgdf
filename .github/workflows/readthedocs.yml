name: readthedocs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "restgdf/**"
      - "tests/**"
      - "docs/**"
      - "readthedocs.yaml"
      - "pyproject.toml"

jobs:
  readthedocs:
    if: "!contains(github.event.head_commit.message, 'Bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code # zizmor: ignore[artipacked] git-auto-commit needs credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Python libraries
      run: |
        python -m pip install --upgrade pip
        python -m pip install --user -e . -r docs/requirements.txt
    - name: "Update docs"
      working-directory: docs
      run: |
        make clean html
    - name: Commit changes
      with:
        COMMIT_MESSAGE: "Update doc files"
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
