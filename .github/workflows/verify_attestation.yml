name: Verify PyPI attestation

# BL-43 (MASTER-PLAN L189-190): post-publish attestation verification.
# Called by the "Publish release" workflow after its PyPI job succeeds;
# downloads the published wheel and verifies its PEP 740 attestation with
# `pypi-attestations verify pypi`. Keeping this as a reusable workflow avoids
# the privileged `workflow_run` trigger while retaining manual recovery.

on:
  workflow_call:
    inputs:
      version:
        description: Version published by the caller.
        required: true
        type: string
      source_ref:
        description: Tag or commit whose project metadata should be checked.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify (e.g. 2.0.0). Leave blank to use latest from PyPI."
        required: false
        default: ""
        type: string
      source_ref:
        description: "Tag or commit to inspect. Leave blank to use the current ref."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: verify-attestation-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify PEP 740 attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pin to the exact SHA that triggered the upstream Publish
          # workflow so `pyproject.toml` reflects the shipped version,
          # not default-branch HEAD (which may have moved).
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pypi-attestations
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypi-attestations

      - name: Resolve release version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          input_version="${INPUT_VERSION}"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
          else
            # Read the package version from pyproject.toml at the SHA
            # that triggered the source workflow; falls back to HEAD.
            version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Verifying restgdf==${version}"

      - name: Download wheel from PyPI
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # PyPI's index can lag a successful trusted publish by roughly
          # 1-3 minutes. Retry the immutable version lookup so the release
          # pipeline does not require a manual rerun during normal propagation.
          for attempt in {1..6}; do
            if python -m pip download \
              --no-deps \
              --dest dist \
              --only-binary=:all: \
              "restgdf==${VERSION}"; then
              break
            fi
            if [[ "${attempt}" -eq 6 ]]; then
              echo "::error::restgdf==${VERSION} was not visible on PyPI after 6 attempts."
              exit 1
            fi
            echo "PyPI has not indexed restgdf==${VERSION}; retrying in 30 seconds."
            sleep 30
          done
          ls -l dist/

      - name: Verify attestation
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          REPO_URL: https://github.com/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/restgdf-*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "::error::No wheel downloaded for restgdf==${VERSION}."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            filename="$(basename "$wheel")"
            echo "::group::pypi-attestations verify pypi ${filename}"
            pypi-attestations verify pypi \
              --repository "${REPO_URL}" \
              "pypi:${filename}"
            echo "::endgroup::"
          done
