name: Publish release

on:
  pull_request:
    paths:
      - pyproject.toml
      - README.md
      - restgdf/**
      - .github/workflows/publish_on_pypi.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver tag to build from manually (for example 2.0.0 or v2.0.0).
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

permissions: {}

concurrency:
  group: publish-release-${{ inputs.release_tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  release-tests:
    # W1-1 (CICD-01): gate the release path on the offline test suite. This
    # job runs on every trigger the workflow has (tag push, workflow_dispatch,
    # pull_request), so build-distributions -> needs: release-tests is never
    # skipped-but-treated-as-success: a failure or non-run of tests always
    # blocks the build, and publish-pypi (needs: build-distributions) inherits
    # the gate transitively. Tests run against the SAME ref that gets built.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all test extras
        # Full non-network suite imports from resilience + telemetry modules;
        # install every extra so the release gate matches the PR gate.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geo,resilience,telemetry]"

      - name: Run offline test suite
        run: python -m pytest -q -m "not network"

  build-distributions:
    needs: release-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-tag: ${{ steps.release_meta.outputs.raw }}
      normalized-version: ${{ steps.release_meta.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve release metadata
        id: release_meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"

          raw_tag=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_tag="${INPUT_RELEASE_TAG}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw_tag="${GITHUB_REF_NAME}"
          fi

          if [ -n "$raw_tag" ]; then
            if [[ ! "$raw_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Release tag must be semver-compatible (for example 2.0.0 or v2.0.0)."
              exit 1
            fi

            normalized="${raw_tag#v}"
            if [ "$normalized" != "$project_version" ]; then
              echo "Release tag ($normalized) must match pyproject.toml version ($project_version)."
              exit 1
            fi
          fi

          {
            echo "raw=${raw_tag}"
            echo "version=${project_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Require CHANGELOG entry for release
        if: steps.release_meta.outputs.raw != ''
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # W1-4 (BL-41 / CICD-02): block the release unless CHANGELOG.md has a
          # non-empty, non-duplicated section for the tagged version. The
          # maintainer renames `## [Unreleased]` to `## [X.Y.Z] - <date>` at
          # tag time; we fail fast here when that section is missing, empty, or
          # duplicated. This step only runs when release_meta.outputs.raw != ''
          # (tag push / workflow_dispatch), never on PR runs or against the
          # `## [Unreleased]` convention.
          header="## [${RELEASE_VERSION}]"

          # Missing header (preserves the prior presence check). `grep -c`
          # prints 0 and exits 1 on no match, so guard it under `set -e`.
          count="$(grep -cF -- "$header" CHANGELOG.md || true)"
          if [ "$count" -eq 0 ]; then
            echo "::error file=CHANGELOG.md::Missing release header '${header}' in CHANGELOG.md."
            echo "Expected '${header}' section before publishing ${RELEASE_VERSION}."
            exit 1
          fi

          # Duplicate header: the same version section appears more than once.
          if [ "$count" -gt 1 ]; then
            echo "::error file=CHANGELOG.md::Duplicate release header '${header}' appears ${count} times in CHANGELOG.md."
            echo "Consolidate the duplicate '${header}' sections before publishing ${RELEASE_VERSION}."
            exit 1
          fi

          # Extract the section body: lines strictly between this header and the
          # next top-level `## [` header. Literal (index/substr) matching, NOT
          # regex, because the header contains `[` and `]` metacharacters.
          # shellcheck disable=SC2016  # $0/$n are awk fields, not shell vars
          body="$(awk -v h="$header" '
            index($0, h) == 1 { f = 1; next }
            f && substr($0, 1, 4) == "## [" { exit }
            f { print }
          ' CHANGELOG.md)"

          # Fail unless the body has at least one non-whitespace character.
          if ! printf '%s\n' "$body" | grep -q "[^[:space:]]"; then
            echo "::error file=CHANGELOG.md::Release section '${header}' is empty."
            echo "Populate the '${header}' section before publishing ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Require CHANGELOG footer link for release
        if: steps.release_meta.outputs.raw != ''
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Q1-a/Q1-b (critic.md): the "## [X.Y.Z]" section header alone is
          # not enough -- the reference-style link definition
          # "[X.Y.Z]: https://.../compare/...&|releases/tag/..." at the
          # CHANGELOG footer is what actually makes the header resolve to a
          # real GitHub URL. bumpver does not touch CHANGELOG.md
          # (pyproject.toml file_patterns omits it), so this link is a
          # manual step the maintainer can forget -- exactly what happened
          # for 3.2.0 (missing "[3.2.0]:" definition, verified). Fail fast
          # here rather than shipping a release whose CHANGELOG entry is a
          # dangling reference. Git tags in this repo are unprefixed (e.g.
          # "3.2.0", not "v3.2.0"), so only the unprefixed form is accepted.
          #
          # Matched literally and anchored to the START of a line: the link
          # prefix contains "[" / "]" regex metacharacters (so no regex), and
          # a reference-style link definition is only a definition in column
          # 1 -- an unanchored substring match would be satisfied by a prose
          # line that merely mentions "[X.Y.Z]:". awk's index($0, p) == 1
          # gives both properties with no escaping.
          link_prefix="[${RELEASE_VERSION}]:"

          count="$(awk -v p="$link_prefix" 'index($0, p) == 1 { n++ } END { print n + 0 }' CHANGELOG.md)"
          if [ "$count" -eq 0 ]; then
            echo "::error file=CHANGELOG.md::Missing footer link definition '${link_prefix}' in CHANGELOG.md."
            echo "Add a '${link_prefix} https://github.com/${GITHUB_REPOSITORY}/compare/<prev>...${RELEASE_VERSION}' line before publishing ${RELEASE_VERSION}."
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "::error file=CHANGELOG.md::Duplicate footer link definition '${link_prefix}' appears ${count} times in CHANGELOG.md."
            echo "Consolidate the duplicate '${link_prefix}' lines before publishing ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    if: github.event_name != 'pull_request' && needs.build-distributions.outputs.release-tag != ''
    needs:
      - build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/restgdf/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  publish-github-release:
    if: github.event_name != 'pull_request' && needs.build-distributions.outputs.release-tag != ''
    needs:
      - build-distributions
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-distributions.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.build-distributions.outputs.normalized-version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading refreshed assets."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --draft \
              --verify-tag \
              --title "restgdf v${RELEASE_VERSION}" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
